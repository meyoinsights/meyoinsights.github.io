 <text x="133" y="624" font-family="Georgia, serif" font-size="25" font-weight="bold" fill="#173d35">Examine the accounts</text>
 <text x="133" y="657" font-family="Arial, sans-serif" font-size="16.8" fill="#536f61">Profit, cash flow, debt and notes</text>
 </g>
<g>
 <rect x="682" y="571" width="450" height="124" rx="22" fill="#fffdf9" stroke="#8caa91" stroke-width="2"/>
 <rect x="702" y="599" width="67" height="67" rx="20" fill="#eaf1e6"/>
 <text x="735.5" y="644" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#1f4937">5</text>
 <text x="789" y="624" font-family="Georgia, serif" font-size="25" font-weight="bold" fill="#173d35">Assess value and price</text>
 <text x="789" y="657" font-family="Arial, sans-serif" font-size="16.8" fill="#536f61">Quality, scenarios and margin of safety</text>
 </g><g>
 <rect x="682" y="404" width="450" height="124" rx="22" fill="#fffdf9" stroke="#8caa91" stroke-width="2"/>
 <rect x="702" y="432" width="67" height="67" rx="20" fill="#eaf1e6"/>
