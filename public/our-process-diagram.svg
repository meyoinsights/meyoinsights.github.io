<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="750" viewBox="0 0 1160 750" role="img" aria-labelledby="title desc">
<title id="title">Meyo Insights eight-stage investment research process</title>
<desc id="desc">Continuous loop: explore; gather evidence; understand the economics; examine the accounts; assess value and price; challenge the thesis; explain the findings; review, publish, and revisit.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6 Z" fill="#6b9470"/></marker></defs>
