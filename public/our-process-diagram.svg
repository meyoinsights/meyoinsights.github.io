<path d="M476 633 H679"/>
<path d="M907 571 V531"/><path d="M907 404 V364"/><path d="M907 237 V197"/>
<path d="M682 132 H479"/>
</g>
<circle cx="579" cy="382" r="95" fill="#e9efe3" stroke="#d1dfd0" stroke-width="2"/>
<text x="579" y="353" font-size="15" text-anchor="middle" letter-spacing="2" font-family="Arial,sans-serif" fill="#557666">THE OBJECTIVE</text>
<text x="579" y="389" font-size="22.5" text-anchor="middle" font-family="Georgia,serif" fill="#173d35">Better investment</text>
<text x="579" y="416" font-size="22.5" text-anchor="middle" font-family="Georgia,serif" fill="#173d35">judgment</text>
<g>
 <rect x="26" y="70" width="450" height="124" rx="22" fill="#fffdf9" stroke="#8caa91" stroke-width="2"/>
 <rect x="46" y="98" width="67" height="67" rx="20" fill="#eaf1e6"/>
 <text x="79.5" y="143" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#1f4937">1</text>
 <text x="133" y="123" font-family="Georgia, serif" font-size="25" font-weight="bold" fill="#173d35">Explore</text>
 <text x="133" y="156" font-family="Arial, sans-serif" font-size="16.8" fill="#536f61">Companies, industries and market shifts</text>
 </g><g>
 <rect x="26" y="237" width="450" height="124" rx="22" fill="#fffdf9" stroke="#8caa91" stroke-width="2"/>
 <rect x="46" y="265" width="67" height="67" rx="20" fill="#eaf1e6"/>
 <text x="79.5" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#1f4937">2</text>
 <text x="133" y="290" font-family="Georgia, serif" font-size="25" font-weight="bold" fill="#173d35">Gather evidence</text>
 <text x="133" y="323" font-family="Arial, sans-serif" font-size="16.8" fill="#536f61">Filings, reports, data and studies</text>
 </g><g>
 <rect x="26" y="404" width="450" height="124" rx="22" fill="#fffdf9" stroke="#8caa91" stroke-width="2"/>
 <rect x="46" y="432" width="67" height="67" rx="20" fill="#eaf1e6"/>
 <text x="79.5" y="477" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#1f4937">3</text>
 <text x="133" y="457" font-family="Georgia, serif" font-size="25" font-weight="bold" fill="#173d35">Understand the economics</text>
 <text x="133" y="490" font-family="Arial, sans-serif" font-size="16.8" fill="#536f61">Customers, competitors and incentives</text>
 </g><g>
 <rect x="26" y="571" width="450" height="124" rx="22" fill="#fffdf9" stroke="#8caa91" stroke-width="2"/>
 <rect x="46" y="599" width="67" height="67" rx="20" fill="#eaf1e6"/>
