 <text x="789" y="457" font-family="Georgia, serif" font-size="25" font-weight="bold" fill="#173d35">Challenge the thesis</text>
 <text x="789" y="490" font-family="Arial, sans-serif" font-size="16.8" fill="#536f61">Risks, cycles and the opposing case</text>
 </g><g>
 <rect x="682" y="237" width="450" height="124" rx="22" fill="#fffdf9" stroke="#8caa91" stroke-width="2"/>
 <rect x="702" y="265" width="67" height="67" rx="20" fill="#eaf1e6"/>
 <text x="735.5" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#1f4937">7</text>
 <text x="789" y="290" font-family="Georgia, serif" font-size="25" font-weight="bold" fill="#173d35">Explain the findings</text>
 <text x="789" y="323" font-family="Arial, sans-serif" font-size="16.8" fill="#536f61">Clear writing, sources and uncertainty</text>
 </g><g>
 <rect x="682" y="70" width="450" height="124" rx="22" fill="#fffdf9" stroke="#8caa91" stroke-width="2"/>
 <rect x="702" y="98" width="67" height="67" rx="20" fill="#eaf1e6"/>
 <text x="735.5" y="143" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#1f4937">8</text>
 <text x="789" y="123" font-family="Georgia, serif" font-size="25" font-weight="bold" fill="#173d35">Review, publish, revisit</text>
 <text x="789" y="156" font-family="Arial, sans-serif" font-size="16.8" fill="#536f61">Human approval, corrections and learning</text>
 </g>
</svg>