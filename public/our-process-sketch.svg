<text x="55" y="106" font-family="'Comic Sans MS','Trebuchet MS',sans-serif" font-size="19"  fill="#526c60"><tspan x="55" dy="0">An iterative process. Automation helps; evidence and publication decisions stay human.</tspan></text>
