<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1257" viewBox="0 0 480 1257" role="img" aria-label="Behind the research"><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" stroke="#648871" stroke-width="1.5" fill="none"/></marker></defs><rect width="480" height="1257" fill="#fffdf8"/><text x="23" y="38" fill="#173d35" font-size="29" font-family="Trebuchet MS,sans-serif" font-weight="bold">Behind the research</text><text x="23" y="72" fill="#526c60" font-size="17" font-family="Trebuchet MS,sans-serif">How the tools fit together.</text><rect x="22" y="130" width="436" height="112" rx="18" fill="#eef6ee" stroke="#648871" stroke-width="2"/><text x="43" y="161" fill="#173d35" font-size="22" font-weight="bold" font-family="Trebuchet MS,sans-serif">1. Research inputs</text><text x="43" y="191" fill="#526c60" font-size="16.5" font-family="Trebuchet MS,sans-serif">RSS, filings, industry studies,</text><text x="43" y="213" fill="#526c60" font-size="16.5" font-family="Trebuchet MS,sans-serif">conversation references</text><path d="M240 244 V270" stroke="#648871" stroke-width="3" marker-end="url(#arr)"/><rect x="22" y="276" width="436" height="112" rx="18" fill="#eef6ee" stroke="#648871" stroke-width="2"/><text x="43" y="307" fill="#173d35" font-size="22" font-weight="bold" font-family="Trebuchet MS,sans-serif">2. Private collection</text><text x="43" y="337" fill="#526c60" font-size="16.5" font-family="Trebuchet MS,sans-serif">Python, RSS collector, source</text><text x="43" y="359" fill="#526c60" font-size="16.5" font-family="Trebuchet MS,sans-serif">inventory and GitHub Actions</text><path d="M240 390 V416" stroke="#648871" stroke-width="3" marker-end="url(#arr)"/><rect x="22" y="422" width="436" height="112" rx="18" fill="#fff9ee" stroke="#648871" stroke-width="2"/><text x="43" y="453" fill="#173d35" font-size="22" font-weight="bold" font-family="Trebuchet MS,sans-serif">3. Evidence and analysis</text><text x="43" y="483" fill="#526c60" font-size="16.5" font-family="Trebuchet MS,sans-serif">Source checks and models</text><text x="43" y="505" fill="#526c60" font-size="16.5" font-family="Trebuchet MS,sans-serif">with human interpretation</text><path d="M240 536 V562" stroke="#648871" stroke-width="3" marker-end="url(#arr)"/><rect x="22" y="568" width="436" height="112" rx="18" fill="#fff9ee" stroke="#648871" stroke-width="2"/><text x="43" y="599" fill="#173d35" font-size="22" font-weight="bold" font-family="Trebuchet MS,sans-serif">4. Editorial workflow</text><text x="43" y="629" fill="#526c60" font-size="16.5" font-family="Trebuchet MS,sans-serif">GitHub Issues and PRs,</text><text x="43" y="651" fill="#526c60" font-size="16.5" font-family="Trebuchet MS,sans-serif">owner review and revisions</text><path d="M240 682 V708" stroke="#648871" stroke-width="3" marker-end="url(#arr)"/><rect x="22" y="714" width="436" height="112" rx="18" fill="#fff9ee" stroke="#648871" stroke-width="2"/><text x="43" y="745" fill="#173d35" font-size="22" font-weight="bold" font-family="Trebuchet MS,sans-serif">5. Publication boundary</text><text x="43" y="775" fill="#526c60" font-size="16.5" font-family="Trebuchet MS,sans-serif">Explicit approval; private</text><text x="43" y="797" fill="#526c60" font-size="16.5" font-family="Trebuchet MS,sans-serif">research stays private</text><path d="M240 828 V854" stroke="#648871" stroke-width="3" marker-end="url(#arr)"/><rect x="22" y="860" width="436" height="112" rx="18" fill="#eef6ee" stroke="#648871" stroke-width="2"/><text x="43" y="891" fill="#173d35" font-size="22" font-weight="bold" font-family="Trebuchet MS,sans-serif">6. Public website</text><text x="43" y="921" fill="#526c60" font-size="16.5" font-family="Trebuchet MS,sans-serif">Astro deployed to GitHub Pages</text><text x="43" y="943" fill="#526c60" font-size="16.5" font-family="Trebuchet MS,sans-serif">and editable SVG diagrams</text><path d="M240 974 V1000" stroke="#648871" stroke-width="3" marker-end="url(#arr)"/><rect x="22" y="1006" width="436" height="112" rx="18" fill="#fff9ee" stroke="#648871" stroke-width="2"/><text x="43" y="1037" fill="#173d35" font-size="22" font-weight="bold" font-family="Trebuchet MS,sans-serif">7. Distribution and data</text><text x="43" y="1067" fill="#526c60" font-size="16.5" font-family="Trebuchet MS,sans-serif">Reviewed X posts; optional</text><text x="43" y="1089" fill="#526c60" font-size="16.5" font-family="Trebuchet MS,sans-serif">GTM / Google Analytics</text><rect x="22" y="1162" width="436" height="56" rx="13" fill="#eaf1e7" stroke="#bdcfc2"/><text x="36" y="1186" font-size="15" font-family="Trebuchet MS,sans-serif" fill="#173d35">Not every subsystem is fully automated.</text><text x="36" y="1205" font-size="15" font-family="Trebuchet MS,sans-serif" fill="#173d35">Publication is human-controlled.</text></svg>