<path d="M383 487 L430 487" fill="none" stroke="#6b9470" stroke-width="3"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M745 487 L788 487" fill="none" stroke="#6b9470" stroke-width="3"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M594 555 L594 612 L219 612 L219 555" fill="none" stroke="#6b9470" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="290" y="588" font-family="'Comic Sans MS','Trebuchet MS',sans-serif" font-size="15"  fill="#536f61"><tspan x="290" dy="0">Source gaps → revisit</tspan></text>
<text x="45" y="717" font-family="'Comic Sans MS','Trebuchet MS',sans-serif" font-size="18" font-weight="bold" fill="#173d35"><tspan x="45" dy="0">PUBLICATION BOUNDARY — explicit owner approval</tspan></text>
<rect x="45" y="741" width="460" height="149" rx="18" fill="#fff8e7" stroke="#c9ab75" stroke-width="2.4"/>
<text x="65" y="783" font-family="'Comic Sans MS','Trebuchet MS',sans-serif" font-size="23" font-weight="bold" fill="#173d35"><tspan x="65" dy="0">Owner approves public release</tspan></text>
<text x="65" y="823" font-family="'Comic Sans MS','Trebuchet MS',sans-serif" font-size="17"  fill="#536f61"><tspan x="65" dy="0">Private merge ≠ permission to publish</tspan></text>
<rect x="555" y="742" width="330" height="134" rx="18" fill="#eef6ee" stroke="#6b9470" stroke-width="2.4"/>
<text x="573" y="776" font-family="'Comic Sans MS','Trebuchet MS',sans-serif" font-size="22" font-weight="bold" fill="#173d35"><tspan x="573" dy="0">Public research journal</tspan></text>
<text x="573" y="806" font-family="'Comic Sans MS','Trebuchet MS',sans-serif" font-size="17"  fill="#536f61"><tspan x="573" dy="0">Reviewed articles,</tspan><tspan x="573" dy="21.76">process and diagrams</tspan></text>
<text x="573" y="852" font-family="'Comic Sans MS','Trebuchet MS',sans-serif" font-size="15"  fill="#52755d"><tspan x="573" dy="0">Astro · GitHub Pages</tspan></text>
<rect x="936" y="742" width="306" height="134" rx="18" fill="#fff9ec" stroke="#6b9470" stroke-width="2.4"/>
<text x="954" y="776" font-family="'Comic Sans MS','Trebuchet MS',sans-serif" font-size="22" font-weight="bold" fill="#173d35"><tspan x="954" dy="0">Distribution &amp; metrics</tspan></text>
<text x="954" y="806" font-family="'Comic Sans MS','Trebuchet MS',sans-serif" font-size="17"  fill="#536f61"><tspan x="954" dy="0">X drafts reviewed;</tspan><tspan x="954" dy="21.76">consented site analytics</tspan></text>
<text x="954" y="852" font-family="'Comic Sans MS','Trebuchet MS',sans-serif" font-size="15"  fill="#52755d"><tspan x="954" dy="0">GTM / GA4 · X manual</tspan></text>
<path d="M947 554 L947 676 L272 676 L272 741" fill="none" stroke="#6b9470" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M505 816 L555 816" fill="none" stroke="#6b9470" stroke-width="3"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
