<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1549" viewBox="0 0 480 1549" role="img" aria-label="Our research workflow"><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" stroke="#648871" stroke-width="1.5" fill="none"/></marker></defs><rect width="480" height="1549" fill="#fffdf8"/><text x="23" y="38" fill="#173d35" font-size="29" font-family="Trebuchet MS,sans-serif" font-weight="bold">Our research workflow</text><text x="23" y="72" fill="#526c60" font-size="17" font-family="Trebuchet MS,sans-serif">A practical, iterative process.</text><rect x="22" y="130" width="436" height="112" rx="18" fill="#eef6ee" stroke="#648871" stroke-width="2"/><text x="43" y="161" fill="#173d35" font-size="22" font-weight="bold" font-family="Trebuchet MS,sans-serif">1. Ideas and inputs</text><text x="43" y="191" fill="#526c60" font-size="16.5" font-family="Trebuchet MS,sans-serif">News, filings, reports, watchlists</text><text x="43" y="213" fill="#526c60" font-size="16.5" font-family="Trebuchet MS,sans-serif">and original research ideas</text><path d="M240 244 V270" stroke="#648871" stroke-width="3" marker-end="url(#arr)"/><rect x="22" y="276" width="436" height="112" rx="18" fill="#fff9ee" stroke="#648871" stroke-width="2"/><text x="43" y="307" fill="#173d35" font-size="22" font-weight="bold" font-family="Trebuchet MS,sans-serif">2. Triage</text><text x="43" y="337" fill="#526c60" font-size="16.5" font-family="Trebuchet MS,sans-serif">Human judgment: pursue, park</text><text x="43" y="359" fill="#526c60" font-size="16.5" font-family="Trebuchet MS,sans-serif">or discard</text><path d="M240 390 V416" stroke="#648871" stroke-width="3" marker-end="url(#arr)"/><rect x="22" y="422" width="436" height="112" rx="18" fill="#eef6ee" stroke="#648871" stroke-width="2"/><text x="43" y="453" fill="#173d35" font-size="22" font-weight="bold" font-family="Trebuchet MS,sans-serif">3. Collect sources</text><text x="43" y="483" fill="#526c60" font-size="16.5" font-family="Trebuchet MS,sans-serif">Gather links, primary documents</text><text x="43" y="505" fill="#526c60" font-size="16.5" font-family="Trebuchet MS,sans-serif">and background studies</text><path d="M240 536 V562" stroke="#648871" stroke-width="3" marker-end="url(#arr)"/><rect x="22" y="568" width="436" height="112" rx="18" fill="#fff9ee" stroke="#648871" stroke-width="2"/><text x="43" y="599" fill="#173d35" font-size="22" font-weight="bold" font-family="Trebuchet MS,sans-serif">4. Verify and reconcile</text><text x="43" y="629" fill="#526c60" font-size="16.5" font-family="Trebuchet MS,sans-serif">Check numbers, sources and notes</text><text x="43" y="651" fill="#526c60" font-size="16.5" font-family="Trebuchet MS,sans-serif">Loop back if evidence conflicts</text><path d="M240 682 V708" stroke="#648871" stroke-width="3" marker-end="url(#arr)"/><rect x="22" y="714" width="436" height="112" rx="18" fill="#fff9ee" stroke="#648871" stroke-width="2"/><text x="43" y="745" fill="#173d35" font-size="22" font-weight="bold" font-family="Trebuchet MS,sans-serif">5. Analyze</text><text x="43" y="775" fill="#526c60" font-size="16.5" font-family="Trebuchet MS,sans-serif">Business, industry, financials,</text><text x="43" y="797" fill="#526c60" font-size="16.5" font-family="Trebuchet MS,sans-serif">valuation and risk</text><path d="M240 828 V854" stroke="#648871" stroke-width="3" marker-end="url(#arr)"/><rect x="22" y="860" width="436" height="112" rx="18" fill="#eef6ee" stroke="#648871" stroke-width="2"/><text x="43" y="891" fill="#173d35" font-size="22" font-weight="bold" font-family="Trebuchet MS,sans-serif">6. Prepare draft</text><text x="43" y="921" fill="#526c60" font-size="16.5" font-family="Trebuchet MS,sans-serif">Writing, charts and social drafts</text><text x="43" y="943" fill="#526c60" font-size="16.5" font-family="Trebuchet MS,sans-serif">with assisted tools</text><path d="M240 974 V1000" stroke="#648871" stroke-width="3" marker-end="url(#arr)"/><rect x="22" y="1006" width="436" height="112" rx="18" fill="#fff9ee" stroke="#648871" stroke-width="2"/><text x="43" y="1037" fill="#173d35" font-size="22" font-weight="bold" font-family="Trebuchet MS,sans-serif">7. Owner editorial review</text><text x="43" y="1067" fill="#526c60" font-size="16.5" font-family="Trebuchet MS,sans-serif">Challenge, revise, park</text><text x="43" y="1089" fill="#526c60" font-size="16.5" font-family="Trebuchet MS,sans-serif">or approve the wording</text><path d="M240 1120 V1146" stroke="#648871" stroke-width="3" marker-end="url(#arr)"/><rect x="22" y="1152" width="436" height="112" rx="18" fill="#fff9ee" stroke="#648871" stroke-width="2"/><text x="43" y="1183" fill="#173d35" font-size="22" font-weight="bold" font-family="Trebuchet MS,sans-serif">8. Approve publication</text><text x="43" y="1213" fill="#526c60" font-size="16.5" font-family="Trebuchet MS,sans-serif">Separate explicit authorization</text><text x="43" y="1235" fill="#526c60" font-size="16.5" font-family="Trebuchet MS,sans-serif">for website and X</text><path d="M240 1266 V1292" stroke="#648871" stroke-width="3" marker-end="url(#arr)"/><rect x="22" y="1298" width="436" height="112" rx="18" fill="#fff9ee" stroke="#648871" stroke-width="2"/><text x="43" y="1329" fill="#173d35" font-size="22" font-weight="bold" font-family="Trebuchet MS,sans-serif">9. Publish and learn</text><text x="43" y="1359" fill="#526c60" font-size="16.5" font-family="Trebuchet MS,sans-serif">Share approved work; correct</text><text x="43" y="1381" fill="#526c60" font-size="16.5" font-family="Trebuchet MS,sans-serif">and revisit as evidence changes</text><rect x="22" y="1454" width="436" height="56" rx="13" fill="#eaf1e7" stroke="#bdcfc2"/><text x="36" y="1478" font-size="15" font-family="Trebuchet MS,sans-serif" fill="#173d35">Collected ≠ verified; drafted ≠ published.</text><text x="36" y="1497" font-size="15" font-family="Trebuchet MS,sans-serif" fill="#173d35">Owner approval is required for release.</text></svg>